name: Horken diagnóstico

# Cada vez que cambia la app o el programa del portátil:
#  1. se pasan las pruebas del programa Python (Linux y Windows)
#  2. se compila la app Android (APK) y queda para descargar en la pestaña "Actions"
on:
  push:
    paths:
      - "diagnostico/**"
      - ".github/workflows/horken-diagnostico.yml"
  workflow_dispatch:

jobs:
  pruebas-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: diagnostico/motor_python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m horken_diag demo --escenario fuchs --segundos 8 --carpeta sesiones

  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diagnostico/app_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Horken.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Horken-app-android
          path: diagnostico/app_flutter/Horken.apk
          retention-days: 90
